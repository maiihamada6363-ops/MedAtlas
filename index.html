<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedPortal | المنصة الطبية الشاملة</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

    <!-- Header -->
    <nav class="bg-white shadow-sm p-4 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-900">MedPortal</h1>
            <button class="bg-blue-600 text-white px-5 py-2 rounded-full text-sm">تسجيل دخول</button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto py-8 px-4">
        
        <!-- هنا هنضيف الجامعات (كارت لكل جامعة) -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            
            <!-- نموذج لجامعة (القالب) -->
            <div class="bg-white p-6 rounded-2xl shadow-md hover:shadow-xl transition duration-300">
                <span class="text-xs font-bold text-blue-600 bg-blue-50 px-3 py-1 rounded-full">حكومية</span>
                <h2 class="text-xl font-bold mt-3 text-gray-800">جامعة الفيوم</h2>
                <p class="text-gray-500 text-sm mt-2">نبذة مختصرة عن الجامعة ومكانتها الأكاديمية...</p>
                
                <div class="mt-4 border-t pt-4">
                    <h4 class="font-bold text-gray-700 text-sm mb-2">الكليات الطبية المتاحة:</h4>
                    <ul class="space-y-2 text-sm text-gray-600">
                        <li class="flex justify-between"><span>طب بشري</span> <span class="text-blue-600">5 سنوات + 2</span></li>
                        <li class="flex justify-between"><span>طب أسنان</span> <span class="text-blue-600">5 سنوات + 1</span></li>
                    </ul>
                </div>
                <button class="w-full mt-6 bg-gray-900 text-white py-2 rounded-xl text-sm hover:bg-gray-800">عرض التفاصيل</button>
            </div>

        </div>
    </main>

</body>
</html>
