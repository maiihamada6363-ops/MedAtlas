<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <title>خريطة الطب الحكومي</title>
    <style>
        :root { --primary: #0ea5e9; --dark: #0f172a; }
        body { font-family: 'Cairo', sans-serif; background: #f8fafc; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        .search-input { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #ddd; margin-bottom: 20px; font-size: 1rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .card { background: white; padding: 20px; border-radius: 15px; border: 1px solid #e2e8f0; cursor: pointer; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px rgba(0,0,0,0.1); }
        h3 { color: var(--dark); margin-top: 0; }
        .tag { background: #dcfce7; color: #166534; padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>دليل الجامعات الحكومية المصرية</h1>
    <input type="text" id="search" class="search-input" placeholder="ابحث باسم الجامعة أو التخصص (مثلاً: طب بشري، المنصورة)...">
    <div class="grid" id="results"></div>
</div>

<script>
const govUnis = [
    { name: "جامعة القاهرة", loc: "الجيزة", specs: ["طب بشري", "طب أسنان", "صيدلة", "علاج طبيعي", "تمريض", "طب بيطري"] },
    { name: "جامعة عين شمس", loc: "القاهرة", specs: ["طب بشري", "طب أسنان", "صيدلة", "تمريض", "علاج طبيعي", "طب بيطري"] },
    { name: "جامعة الإسكندرية", loc: "الإسكندرية", specs: ["طب بشري", "طب أسنان", "صيدلة", "تمريض", "علاج طبيعي", "طب بيطري"] },
    { name: "جامعة المنصورة", loc: "الدقهلية", specs: ["طب بشري", "طب أسنان", "صيدلة", "تمريض", "علاج طبيعي", "طب بيطري"] },
    { name: "جامعة أسيوط", loc: "أسيوط", specs: ["طب بشري", "طب أسنان", "صيدلة", "تمريض", "علاج طبيعي", "طب بيطري"] },
    { name: "جامعة الزقازيق", loc: "الشرقية", specs: ["طب بشري", "طب أسنان", "صيدلة", "تمريض", "علاج طبيعي", "طب بيطري"] },
    { name: "جامعة طنطا", loc: "الغربية", specs: ["طب بشري", "طب أسنان", "صيدلة", "تمريض", "علاج طبيعي", "طب بيطري"] },
    { name: "جامعة قناة السويس", loc: "الإسماعيلية", specs: ["طب بشري", "طب أسنان", "صيدلة", "تمريض", "علاج طبيعي", "طب بيطري"] },
    { name: "جامعة بني سويف", loc: "بني سويف", specs: ["طب بشري", "طب أسنان", "صيدلة", "تمريض", "علاج طبيعي", "طب بيطري"] },
    { name: "جامعة الفيوم", loc: "الفيوم", specs: ["طب بشري", "طب أسنان", "صيدلة", "تمريض", "علاج طبيعي", "طب بيطري"] },
    { name: "جامعة المنيا", loc: "المنيا", specs: ["طب بشري", "طب أسنان", "صيدلة", "تمريض", "علاج طبيعي", "طب بيطري"] },
    { name: "جامعة سوهاج", loc: "سوهاج", specs: ["طب بشري", "طب أسنان", "صيدلة", "تمريض", "علاج طبيعي", "طب بيطري"] },
    { name: "جامعة جنوب الوادي", loc: "قنا", specs: ["طب بشري", "طب أسنان", "صيدلة", "تمريض", "علاج طبيعي", "طب بيطري"] },
    { name: "جامعة أسوان", loc: "أسوان", specs: ["طب بشري", "تمريض", "طب بيطري"] },
    { name: "جامعة كفر الشيخ", loc: "كفر الشيخ", specs: ["طب بشري", "طب أسنان", "صيدلة", "تمريض", "علاج طبيعي", "طب بيطري"] },
    { name: "جامعة بنها", loc: "القليوبية", specs: ["طب بشري", "طب أسنان", "صيدلة", "تمريض", "علاج طبيعي", "طب بيطري"] },
    { name: "جامعة دمنهور", loc: "البحيرة", specs: ["صيدلة"] },
    { name: "جامعة السويس", loc: "السويس", specs: ["طب بشري", "تمريض"] },
    { name: "جامعة بورسعيد", loc: "بورسعيد", specs: ["طب بشري", "تمريض"] },
    { name: "جامعة العريش", loc: "شمال سيناء", specs: ["تمريض"] }
];

function render(filter = "") {
    const container = document.getElementById('results');
    container.innerHTML = govUnis.filter(u => 
        u.name.includes(filter) || u.specs.join().includes(filter) || u.loc.includes(filter)
    ).map(u => `
        <div class="card">
            <span class="tag">حكومية</span>
            <h3>${u.name}</h3>
            <p><strong>📍 الموقع:</strong> ${u.loc}</p>
            <p><strong>🩺 التخصصات:</strong> ${u.specs.join('، ')}</p>
        </div>
    `).join('');
}

document.getElementById('search').oninput = (e) => render(e.target.value);
render();
</script>
</body>
</html>
