<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">

    <title>MedAtlas | خريطتك للتعليم الطبي والجامعي في مصر</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box}
        :root{--navy:#082b50;--blue:#1677ff;--pale:#f5f9ff;--line:#e0eaf5;--muted:#6f8297}
        body{margin:0;color:var(--navy);background:#fcfdfe;font-family:'Cairo',sans-serif}
        
        nav{height:70px;padding:0 6%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#ffffffed;backdrop-filter:blur(12px);position:sticky;top:0;z-index:100}
        .logo{color:var(--navy);font-weight:800;font-size:22px;text-decoration:none;display:flex;align-items:center;gap:6px;cursor:pointer}
        .logo span{color:var(--blue)}
        .navActions{display:flex;gap:10px;align-items:center}
        .navBtn{background:var(--blue);color:white;border:none;padding:8px 16px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
        .navBtn.sec{background:#edf5ff;color:var(--blue)}

        .hero{padding:40px 6% 25px;text-align:center;background:radial-gradient(circle at 50% 30%,#e4f1ff 0,transparent 50%)}
        .hero h1{font-size:clamp(24px,4vw,36px);margin:10px 0}
        .hero p{font-size:14px;color:var(--muted);max-width:750px;margin:0 auto 20px}

        .searchBox{max-width:550px;margin:0 auto 15px;position:relative}
        .searchBox input{width:100%;padding:12px 20px;border:1px solid var(--line);border-radius:99px;font-family:inherit;font-size:13px;outline:none;box-shadow:0 2px 10px #00000008}
        .searchBox input:focus{border-color:var(--blue)}

        .tabs{display:flex;justify-content:center;gap:8px;margin:15px 0 5px;flex-wrap:wrap}
        .tabBtn{padding:8px 16px;border-radius:99px;border:1px solid var(--line);background:#fff;font-family:inherit;font-weight:700;font-size:12px;cursor:pointer;color:var(--navy)}
        .tabBtn.active{background:var(--blue);color:#fff;border-color:var(--blue)}

        .container{padding:20px 6% 60px;max-width:1250px;margin:0 auto}
        .breadcrumb{display:flex;gap:8px;font-size:12px;color:var(--muted);margin-bottom:20px;align-items:center;flex-wrap:wrap}
        .breadcrumb span{cursor:pointer;color:var(--blue);font-weight:700}

        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
        .card{border:1px solid var(--line);border-radius:16px;padding:22px;background:#fff;box-shadow:0 4px 15px #00000003;cursor:pointer;transition:0.2s;display:flex;flex-direction:column;justify-content:space-between}
        .card:hover{transform:translateY(-3px);border-color:var(--blue);box-shadow:0 8px 25px #00000008}
        .cardTag{font-size:11px;font-weight:700;color:var(--blue);background:#eef6ff;padding:3px 10px;border-radius:6px;display:inline-block;margin-bottom:10px;align-self:flex-start}
        .card h3{margin:0 0 8px 0;font-size:15px;line-height:1.4}
        .card p{font-size:12px;color:var(--muted);line-height:1.6;margin:0}

        .adminBox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:25px;margin-bottom:30px}
        .formGrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
        @media(max-width:768px){.formGrid{grid-template-columns:1fr}}
        .formGrid label{display:grid;gap:5px;font-size:12px;font-weight:700}
        .formGrid input, .formGrid select, .formGrid textarea{width:100%;font:inherit;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:12px}
        .full{grid-column:1/-1}
        .submitBtn{background:var(--blue);color:#fff;border:none;padding:10px;border-radius:8px;font-weight:700;cursor:pointer;font-family:inherit}
    </style>
</head>
<body>

    <nav>
        <div class="logo" onclick="goHome()"><span>✦</span> MedAtlas <small style="font-size:11px;color:var(--muted);margin-right:8px;" id="countryBadge">🇪🇬 مصر</small></div>
        <div class="navActions">

        </section>

        <div class="container">

    </div>

            if(sec === 'الكل') document.getElementById('tabAll').classList.add('active');
            if(sec === 'حكومية') document.getElementById('tabGov').classList.add('active');
            if(sec === 'أهلية') document.getElementById('tabNat').classList.add('active');
            if(sec === 'خاصة') document.getElementById('tabPvt').classList.add('active');
            if(sec === 'تكنولوجية') document.getElementById('tabTech').classList.add('active');
            renderUniversities();
        }

        function searchUni() { renderUniversities(); }

        function getSectorLabel(type) {
            if (lang === 'en') {
                if(type === 'حكومية') return 'Public';
                if(type === 'أهلية') return 'National';
                if(type === 'خاصة') return 'Private';
                if(type === 'تكنولوجية') return 'Technological';
            }
            return type;
        }

        function renderUniversities() {
            let query = document.getElementById('searchInput').value.toLowerCase().trim();
            let list = (currentSector === 'الكل') ? db : db.filter(u => u.type === currentSector);

            if(query) {
                list = list.filter(u => 
                    u.nameAr.toLowerCase().includes(query) || 
                    u.nameEn.toLowerCase().includes(query)
                );
            }
            
            document.getElementById('bc').innerHTML = `<span onclick="goHome()">${lang === 'ar' ? 'الرئيسية (الجامعات)' : 'Home (Universities)'}</span>`;
            
            let html = list.map(u => `
                <div class="card" onclick="openUni(${u.id})">
                    <div>
                        <span class="cardTag">${getSectorLabel(u.type)}</span>
                        <h3>${lang === 'ar' ? u.nameAr : u.nameEn}</h3>
                        <p>${lang === 'ar' ? u.descAr : u.descEn}</p>
                    </div>
                </div>
            `).join('');

            document.getElementById('contentArea').innerHTML = `<div class="grid">${html || '<p style="text-align:center;grid-column:1/-1;color:var(--muted);padding:40px;">لا توجد جامعة تطابق بحثك.</p>'}</div>`;
        }

        function openUni(uniId) {
            let uni = db.find(u => u.id === uniId);
            let name = lang === 'ar' ? uni.nameAr : uni.nameEn;
            let desc = lang === 'ar' ? uni.descAr : uni.descEn;

            document.getElementById('bc').innerHTML = `
                <span onclick="goHome()">${lang === 'ar' ? 'الرئيسية' : 'Home'}</span> / 
                <b>${name}</b>
            `;

            let facName = lang === 'ar' ? 'الكليات والبرامج المتاحة' : 'Faculties & Programs';
            let facDesc = lang === 'ar' ? 'عرض الكليات، البرامج التعليمية، والمناهج' : 'Explore faculties and study curricula';

            document.getElementById('contentArea').innerHTML = `
                <div style="margin-bottom:20px; background:#eaf4ff; padding:20px; border-radius:12px;">
                    <span class="cardTag" style="margin-bottom:8px;">${getSectorLabel(uni.type)}</span>
                    <h2 style="margin:0 0 8px 0;">${name}</h2>
                    <p style="margin:0; font-size:13px; color:var(--muted); line-height:1.6;">${desc}</p>
                </div>
                <h3>${lang === 'ar' ? 'القطاعات الكاديمية:' : 'Academic Sectors:'}</h3>
                <div class="grid">
                    <div class="card" onclick="openFaculty(${uni.id})">
                        <div>
                            <span class="cardTag">${lang === 'ar' ? 'كليات' : 'Faculties'}</span>
                            <h3>${facName}</h3>
                            <p>${facDesc}</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function openFaculty(uniId) {
            let uni = db.find(u => u.id === uniId);
            let name = lang === 'ar' ? uni.nameAr : uni.nameEn;
            let years = lang === 'ar' 
                ? ["السنة الأولى", "السنة الثانية", "السنة الثالثة", "السنة الرابعة", "السنة الخامسة"]
                : ["First Year", "Second Year", "Third Year", "Fourth Year", "Fifth Year"];

            document.getElementById('bc').innerHTML = `
                <span onclick="goHome()">${lang === 'ar' ? 'الرئيسية' : 'Home'}</span> / 
                <span onclick="openUni(${uni.id})">${name}</span> / 
                <b>${lang === 'ar' ? 'المناهج الدراسية' : 'Study Years'}</b>
            `;

            let html = years.map(y => `
                <div class="card">
                    <div>
                        <span class="cardTag">${lang === 'ar' ? 'سنة دراسية' : 'Academic Year'}</span>
                        <h3>${y}</h3>
                        <p>${lang === 'ar' ? 'المواد والمصادر المتاحة' : 'Available subjects & study materials'}</p>
                    </div>
                </div>
            `).join('');

            document.getElementById('contentArea').innerHTML = `
                <h3>${lang === 'ar' ? 'اختر السنة الدراسية:' : 'Select Academic Year:'}</h3>
                <div class="grid">${html}</div>
            `;
        }

        // Admin Access
        let isAdmin = false;
        function toggleAdmin() {
            if(!isAdmin) {
                let p = prompt("أدخلي كلمة السر للوصول للوحة الإدارة:");
                if(p === ADMIN_PASS) {
                    isAdmin = true;
                    document.getElementById('userView').style.display = 'none';
                    document.getElementById('adminView').style.display = 'block';
                    document.getElementById('adminToggle').textContent = '↗';
                } else if(p) alert("كلمة السر خاطئة!");
            } else {
                isAdmin = false;
                document.getElementById('userView').style.display = 'block';
                document.getElementById('adminView').style.display = 'none';
                document.getElementById('adminToggle').textContent = '🔒';
                renderUniversities();
            }
        }

        document.getElementById('fUni').onsubmit = e => {
            e.preventDefault();
            db.push({
                id: Date.now(),
                type: document.getElementById('uType').value,
                nameAr: document.getElementById('uNameAr').value,
                nameEn: document.getElementById('uNameEn').value,
                descAr: document.getElementById('uDescAr').value,
                descEn: document.getElementById('uDescEn').value
            });
            saveDB(); alert("تمت إضافة الجامعة بنجاح!"); e.target.reset();
        };

        // Render initial view
        renderUniversities();
    </script>
</body>
</html>
