<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedPortal Egypt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .category-pill { transition: 0.3s; }
        .category-pill:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="bg-slate-50 text-gray-900">

    <header class="bg-white border-b p-6">
        <div class="container mx-auto">
            <h1 class="text-3xl font-black text-blue-900">MedPortal Egypt</h1>
            <p class="text-gray-500 mt-2">دليلك الشامل لكل الجامعات والكليات الطبية في مصر</p>
        </div>
    </header>

    <main class="container mx-auto py-10 px-4">
        <!-- تصنيف الفئات -->
        <div class="flex flex-wrap gap-4 mb-10">
            <button class="bg-blue-900 text-white px-6 py-2 rounded-full font-bold">الكل</button>
            <button class="bg-blue-100 text-blue-900 px-6 py-2 rounded-full font-bold hover:bg-blue-200">حكومي</button>
            <button class="bg-emerald-100 text-emerald-900 px-6 py-2 rounded-full font-bold hover:bg-emerald-200">أهلي</button>
            <button class="bg-purple-100 text-purple-900 px-6 py-2 rounded-full font-bold hover:bg-purple-200">خاص</button>
        </div>

        <!-- هنا سيتم عرض الجامعات برمجياً -->
        <div id="universitiesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- الكروت ستظهر هنا -->
        </div>
    </main>

    <script>
        // هذه هي "قاعدة البيانات" التي سنجمع فيها كل الجامعات (سنقوم بتعبئتها معاً)
        const universities = [
            { name: "جامعة الفيوم", type: "حكومي", desc: "جامعة حكومية عريقة...", faculties: ["طب بشري", "أسنان", "صيدلة", "تمريض"] },
            { name: "جامعة القاهرة", type: "حكومي", desc: "أكبر صرح طبي في مصر...", faculties: ["طب بشري", "أسنان", "صيدلة", "تمريض", "علاج طبيعي"] },
            { name: "جامعة الجلالة", type: "أهلي", desc: "جامعة حديثة بنظم ذكية...", faculties: ["طب بشري", "أسنان", "صيدلة"] },
            // سنقوم بإضافة كل الجامعات هنا لاحقاً..
        ];

        function renderGrid() {
            const grid = document.getElementById('universitiesGrid');
            grid.innerHTML = universities.map(uni => `
                <div class="bg-white p-6 rounded-2xl shadow-sm border hover:shadow-lg transition">
                    <span class="text-[10px] uppercase font-bold text-gray-400">${uni.type}</span>
                    <h3 class="text-lg font-bold mt-1">${uni.name}</h3>
                    <p class="text-sm text-gray-500 mt-2 mb-4">${uni.desc}</p>
                    <div class="space-y-1">
                        ${uni.faculties.map(f => `<div class="text-xs bg-gray-100 p-2 rounded">${f}</div>`).join('')}
                    </div>
                </div>
            `).join('');
        }
        renderGrid();
    </script>
</body>
</html>
