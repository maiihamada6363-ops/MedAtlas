<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MedAtlas | خريطتك للتعليم الجامعي في مصر</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
        }
        header {
            background: #ffffff;
            border-bottom: 1px solid var(--border);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
        .hero {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .hero h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }
        .hero p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        .controls {
            background: #fff;
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        @media (max-width: 640px) {
            .controls { grid-template-columns: 1fr; }
        }
        input, select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            background: #f8fafc;
            transition: 0.2s;
        }
        input:focus, select:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }
        .stats {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .badge {
            background: #e0f2fe;
            color: var(--primary-dark);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.25rem;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.25rem;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card:hover {
            transform: translateY(-3px);
            border-color: var(--primary);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
        }
        .card-type {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            display: inline-block;
            margin-bottom: 8px;
            width: fit-content;
        }
        .type-gov { background: #dcfce7; color: #15803d; }
        .type-nat { background: #fef9c3; color: #a16207; }
        .type-pvt { background: #e0e7ff; color: #4338ca; }
        .type-tech { background: #fae8ff; color: #86198f; }

        .card h3 {
            font-size: 1.05rem;
            color: var(--text-main);
            margin-bottom: 6px;
        }
        .card p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">✦ MedAtlas</div>
        <span class="badge">🇪🇬 مصر</span>
    </header>

    <div class="container">
        <div class="hero">
            <h1>دليل جامعات جمهورية مصر العربية</h1>
            <p>ابحث وتصفح كافة الجامعات الحكومية، الأهلية، الخاصة، والتكنولوجية</p>
        </div>

        <div class="controls">
            <input type="text" id="searchInput" oninput="filterData()" placeholder="ابحث باسم الجامعة...">
            <select id="typeFilter" onchange="filterData()">
                <option value="الكل">كل القطاعات</option>
                <option value="حكومية">الجامعات الحكومية</option>
                <option value="أهلية">الجامعات الأهلية</option>
                <option value="خاصة">الجامعات الخاصة والدولية</option>
                <option value="تكنولوجية">الجامعات التكنولوجية</option>
            </select>
        </div>

        <div class="stats" id="statsBar"></div>
        <div class="grid" id="uniGrid"></div>
    </div>

    <script>
        const universities = [
            // حكومية
            { name: "جامعة القاهرة", type: "حكومية" },
            { name: "جامعة عين شمس", type: "حكومية" },
            { name: "جامعة الإسكندرية", type: "حكومية" },
            { name: "جامعة المنصورة", type: "حكومية" },
            { name: "جامعة أسيوط", type: "حكومية" },
            { name: "جامعة طنطا", type: "حكومية" },
            { name: "جامعة الزقازيق", type: "حكومية" },
            { name: "جامعة حلوان", type: "حكومية" },
            { name: "جامعة المنوفية", type: "حكومية" },
            { name: "جامعة قناة السويس", type: "حكومية" },
            { name: "جامعة المنيا", type: "حكومية" },
            { name: "جامعة جنوب الوادي", type: "حكومية" },
            { name: "جامعة بني سويف", type: "حكومية" },
            { name: "جامعة الفيوم", type: "حكومية" },
            { name: "جامعة بنها", type: "حكومية" },
            { name: "جامعة كفر الشيخ", type: "حكومية" },
            { name: "جامعة سوهاج", type: "حكومية" },
            { name: "جامعة بورسعيد", type: "حكومية" },
            { name: "جامعة دمنهور", type: "حكومية" },
            { name: "جامعة أسوان", type: "حكومية" },
            { name: "جامعة دمياط", type: "حكومية" },
            { name: "جامعة السويس", type: "حكومية" },
            { name: "جامعة العريش", type: "حكومية" },
            { name: "جامعة الأقصر", type: "حكومية" },
            { name: "جامعة الوادي الجديد", type: "حكومية" },
            { name: "جامعة مطروح", type: "حكومية" },
            { name: "جامعة مدينة السادات", type: "حكومية" },
            { name: "جامعة الأزهر", type: "حكومية" },

            // أهلية
            { name: "جامعة الملك سلمان الدولية", type: "أهلية" },
            { name: "جامعة العلمين الدولية", type: "أهلية" },
            { name: "جامعة الجلالة", type: "أهلية" },
            { name: "جامعة المنصورة الجديدة", type: "أهلية" },
            { name: "جامعة النيل الأهلية", type: "أهلية" },
            { name: "جامعة مصر للمعلوماتية", type: "أهلية" },
            { name: "جامعة القاهرة الأهلية", type: "أهلية" },
            { name: "جامعة عين شمس الأهلية", type: "أهلية" },
            { name: "جامعة حلوان الأهلية", type: "أهلية" },
            { name: "جامعة الإسكندرية الأهلية", type: "أهلية" },
            { name: "جامعة المنصورة الأهلية", type: "أهلية" },
            { name: "جامعة بنها الأهلية", type: "أهلية" },
            { name: "جامعة المنوفية الأهلية", type: "أهلية" },
            { name: "جامعة الزقازيق الأهلية", type: "أهلية" },
            { name: "جامعة بني سويف الأهلية", type: "أهلية" },
            { name: "جامعة أسيوط الأهلية", type: "أهلية" },
            { name: "جامعة جنوب الوادي الأهلية", type: "أهلية" },
            { name: "جامعة المنيا الأهلية", type: "أهلية" },
            { name: "جامعة شرق بورسعيد الأهلية", type: "أهلية" },
            { name: "جامعة الإسماعيلية الجديدة الأهلية", type: "أهلية" },

            // خاصة ودولية
            { name: "جامعة 6 أكتوبر", type: "خاصة" },
            { name: "جامعة أكتوبر للعلوم الحديثة والآداب (MSA)", type: "خاصة" },
            { name: "جامعة مصر للعلوم والتكنولوجيا (MUST)", type: "خاصة" },
            { name: "جامعة مصر الدولية (MIU)", type: "خاصة" },
            { name: "الجامعة الألمانية بالقاهرة (GUC)", type: "خاصة" },
            { name: "الجامعة البريطانية في مصر (BUE)", type: "خاصة" },
            { name: "جامعة الأهرام الكندية (ACU)", type: "خاصة" },
            { name: "جامعة المستقبل (FUE)", type: "خاصة" },
            { name: "الجامعة المصرية الروسية (ERU)", type: "خاصة" },
            { name: "جامعة بدر بالقاهرة (BUC)", type: "خاصة" },
            { name: "جامعة الجيزة الجديدة (NGU)", type: "خاصة" },
            { name: "جامعة سيناء", type: "خاصة" },
            { name: "جامعة فاروس بالإسكندرية", type: "خاصة" },
            { name: "جامعة النهضة", type: "خاصة" },
            { name: "الجامعة الأمريكية بالقاهرة (AUC)", type: "خاصة" },

            // تكنولوجية
            { name: "جامعة القاهرة الجديدة التكنولوجية", type: "تكنولوجية" },
            { name: "جامعة الدلتا التكنولوجية", type: "تكنولوجية" },
            { name: "جامعة بني سويف التكنولوجية", type: "تكنولوجية" },
            { name: "جامعة أسيوط الجديدة التكنولوجية", type: "تكنولوجية" },
            { name: "جامعة برج العرب التكنولوجية", type: "تكنولوجية" }
        ];

        function getClassTag(type) {
            if(type === 'حكومية') return 'type-gov';
            if(type === 'أهلية') return 'type-nat';
            if(type === 'خاصة') return 'type-pvt';
            return 'type-tech';
        }

        function filterData() {
            const q = document.getElementById('searchInput').value.trim().toLowerCase();
            const type = document.getElementById('typeFilter').value;

            const filtered = universities.filter(u => {
                const matchName = u.name.toLowerCase().includes(q);
                const matchType = (type === 'الكل') || (u.type === type);
                return matchName && matchType;
            });

            document.getElementById('statsBar').innerHTML = `<span class="badge">العدد المعروض: ${filtered.length} جامعة</span>`;

            document.getElementById('uniGrid').innerHTML = filtered.map(u => `
                <div class="card">
                    <div>
                        <span class="card-type ${getClassTag(u.type)}">${u.type}</span>
                        <h3>${u.name}</h3>
                        <p>مؤسسة تعليمية معتمدة من وزارة التعليم العالي</p>
                    </div>
                </div>
            `).join('');
        }

        filterData();
    </script>
</body>
</html>
